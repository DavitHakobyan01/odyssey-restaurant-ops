# One-command Postgres for reviewers.
#   docker compose up -d
# Produces exactly the DATABASE_URL in .env.example, so nothing else needs changing.
services:
  postgres:
    image: postgres:15-alpine
    container_name: odyssey-restaurant-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: odyssey
      POSTGRES_PASSWORD: odyssey
      POSTGRES_DB: restaurant
    ports:
      - "5432:5432"
    volumes:
      - odyssey-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odyssey -d restaurant"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  odyssey-pgdata:
